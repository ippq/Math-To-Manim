[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-manim"
version = "1.1.0"
description = "Ask a question -> get one companion image or short GIF for a knowledge atom."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian H. Cooper" }]
keywords = ["manim", "animation", "mathematics", "claude"]
dependencies = []

[project.optional-dependencies]
render = [
  "manim>=0.19",
]

[project.scripts]
math-to-manim = "mythos.cli:main"
m2m = "mythos.cli:main"

[project.urls]
Homepage = "https://github.com/ippq/Math-To-Manim"
Repository = "https://github.com/ippq/Math-To-Manim"

[tool.setuptools.packages.find]
include = ["mythos*"]

[tool.setuptools.package-data]
mythos = ["agents/*.md"]
